<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RentBook — Rental Management</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="The easiest way to manage rent, tenants, payments, and compound operations.">
  <meta name="theme-color" content="#1b8a5a">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RentBook">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f8fafc;
    }

    body.splash-active {
      overflow: hidden;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
      background: linear-gradient(165deg, #1a7f52 0%, #146843 45%, #0f5234 100%);
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #app-splash::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 85% 12%, rgba(255, 255, 255, 0.14) 0%, transparent 42%),
        radial-gradient(circle at 12% 88%, rgba(255, 255, 255, 0.08) 0%, transparent 40%);
      pointer-events: none;
    }

    #app-splash.splash-hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: min(100%, 18rem);
    }

    .splash-logo {
      width: 5.5rem;
      height: 5.5rem;
      border-radius: 1.25rem;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    }

    .splash-logo img {
      width: 3.75rem;
      height: 3.75rem;
      border-radius: 0.875rem;
    }

    .splash-brand {
      margin: 1.125rem 0 0;
      color: #fff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .splash-tagline {
      margin: 0.375rem 0 0;
      color: rgba(255, 255, 255, 0.86);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.9375rem;
      line-height: 1.45;
    }

    .splash-spinner {
      width: 1.75rem;
      height: 1.75rem;
      margin-top: 1.75rem;
      border: 2.5px solid rgba(255, 255, 255, 0.28);
      border-top-color: #fff;
      border-radius: 50%;
      animation: splash-spin 0.75s linear infinite;
    }

    #app-splash.splash-error .splash-spinner {
      display: none;
    }

    .splash-status {
      margin: 0.875rem 0 0;
      min-height: 1.25rem;
      color: rgba(255, 255, 255, 0.78);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.8125rem;
      line-height: 1.4;
    }

    @keyframes splash-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body class="splash-active">
  <div id="app-splash" role="status" aria-live="polite" aria-busy="true" aria-label="Loading RentBook">
    <div class="splash-inner">
      <div class="splash-logo">
        <img src="icons/icon-192x192.png" width="60" height="60" alt="">
      </div>
      <h1 class="splash-brand">RentBook</h1>
      <p class="splash-tagline">Manage rent, tenants &amp; payments</p>
      <div class="splash-spinner" aria-hidden="true"></div>
      <p class="splash-status" id="splash-status">Loading…</p>
    </div>
  </div>

  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
