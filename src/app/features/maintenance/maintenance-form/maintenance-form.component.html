<div class="form-page">
<a routerLink="/requests" class="back-link">← Cancel</a>

<app-page-header title="New Request" subtitle="Report a maintenance issue" />

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-card">
  @if (isTenantUser()) {
    @if (tenantContext(); as context) {
      <p class="form-hint tenant-context">
        <span>Property: <strong>{{ context.propertyName }}</strong></span>
        <span>Unit: <strong>{{ context.unitName }}</strong></span>
      </p>
    }
  } @else {
    @if (properties$ | async; as properties) {
      <label>
        Property
        <select formControlName="propertyId">
          <option value="" disabled>Select property</option>
          @for (property of properties; track property.id) {
            <option [value]="property.id">{{ property.name }}</option>
          }
        </select>
      </label>
    }

    @if (tenants$ | async; as tenants) {
      <label>
        Tenant (optional)
        <select formControlName="tenantId">
          <option value="">No tenant selected</option>
          @for (tenant of tenants; track tenant.id) {
            @if (!form.controls.propertyId.value || tenant.propertyId === form.controls.propertyId.value) {
              <option [value]="tenant.id">{{ tenant.name }}</option>
            }
          }
        </select>
      </label>
    }
  }

  <label>
    Issue Type
    <select formControlName="category" (change)="onCategoryChange($any($event.target).value)">
      @for (cat of categories; track cat.value) {
        <option [value]="cat.value">{{ cat.label }}</option>
      }
    </select>
  </label>

  <label>
    Title
    <input type="text" formControlName="title" placeholder="Brief description" />
  </label>

  <label>
    Details
    <textarea formControlName="description" rows="3" placeholder="Describe the issue…"></textarea>
  </label>

  @if (error()) {
    <p class="form-error">{{ error() }}</p>
  }

  <div class="form-actions">
    <a routerLink="/requests" class="btn-secondary">Cancel</a>
    <button type="submit" class="btn-primary" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Submitting…' : 'Submit Request' }}
    </button>
  </div>
</form>
</div>
